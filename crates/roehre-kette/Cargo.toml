[package]
name = "roehre-kette"
description = "Übersetzt das Einstellungsmodell von roehre in librashader-Shaderketten und Parameter (backend-neutral)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
roehre-modell.workspace = true
# Optional (Standard an): ohne librashader bleiben Kettenwahl und Reglerplanung
# (`plane`) übrig — für Spiele, die die Ketten über roehre-wgsl selbst ausführen (W-009).
librashader = { workspace = true, features = ["presets"], optional = true }
thiserror.workspace = true

[features]
default = ["librashader"]
librashader = ["dep:librashader"]
