# Voreinstellung „Profi-Monitor PVM“
# Studiomonitor mit RGB-Eingang und feiner Streifenmaske (um 600 Fernsehzeilen): scharfe,
# deutlich getrennte Zeilen, kaum Licht im Glas, fast flache Röhre.
version = 1

[meta]
name = "Profi-Monitor PVM"
beschreibung = "Studiomonitor am RGB-Eingang: feine Streifenmaske, scharfe und deutlich getrennte Zeilen, kaum Überstrahlen, fast flaches Glas."
name_en = "Professional monitor PVM"
beschreibung_en = "Studio monitor on RGB input: fine aperture grille, sharp and clearly separated lines, hardly any bloom, almost flat glass."
lizenz = "gpl"

[signal]
art = "rgb"

[strahl]
form_dunkel = 2.0
form_hell = 1.1
aufblaehen = 0.45
schaerfe = 6.5

[maske]
typ = "streifenmaske"
staerke = 0.45
staerke_dunkel = 0.45
triaden = 600

[leuchtstoff]
profil = "smpte_c"
nachgluehen = 0.1

[licht]
glow = 0.03
bloom = 0.0
halation = 0.0

[geometrie]
woelbung_x = 0.008
woelbung_y = 0.0
ecken = 0.015
randweich = 0.05

[helligkeit]
ausgleich_dunkel = 1.8
ausgleich_hell = 1.8
nachher = 1.22

[bildformat]
# Harte, schmale Zeilen schweben bei krummen Faktoren (gemessen 1080p: bis 5,8 %);
# ganzzahlig unter 0,25 %.
ganzzahlig = true
