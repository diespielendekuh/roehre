# Voreinstellung „Wohnzimmer-Fernseher 90er (Composite)“
# Ein typischer Fernseher, angeschlossen über das gelbe Cinch-Kabel:
# Farbsäume, Regenbogen an feinen Mustern, weichere Zeilen, mehr Licht im Glas.
version = 1

[meta]
name = "Wohnzimmer-Fernseher 90er (Composite)"
beschreibung = "Typischer Fernseher am gelben Cinch-Kabel: Farbsäume, Regenbogen an feinen Mustern, weiche Zeilen, gewölbtes Glas."
lizenz = "gpl"

[signal]
art = "composite"
norm = "ntsc"
artefakte = 0.8
farbsaum = 0.7

[strahl]
form_dunkel = 1.3
form_hell = 0.8
aufblaehen = 0.9
schaerfe = 3.0

[maske]
typ = "schlitzmaske"
staerke = 0.35
staerke_dunkel = 1.1
triaden = 380

[leuchtstoff]
profil = "p22"
nachgluehen = 0.2

[licht]
glow = 0.1
bloom = 0.15
halation = 0.1

[geometrie]
woelbung_x = 0.03
woelbung_y = 0.04
ecken = 0.04
randweich = 0.25
vignette = 0.15
overscan = 3.0

[helligkeit]
ausgleich_dunkel = 1.7
ausgleich_hell = 1.6
nachher = 1.14
