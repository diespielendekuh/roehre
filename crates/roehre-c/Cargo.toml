[package]
name = "roehre-c"
description = "C-Schnittstelle von roehre (include/roehre.h): Katalog, Einstellungen, Vorschaubild, Austausch mit Vulkan und D3D12."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "roehre"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
roehre-modell.workspace = true
roehre-wgpu.workspace = true
roehre-raum.workspace = true
roehre-testbilder.workspace = true
wgpu.workspace = true
pollster.workspace = true
serde_json.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "android", target_os = "freebsd"))'.dependencies]
ash = "0.38"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
