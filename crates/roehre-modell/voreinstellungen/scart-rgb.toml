# Voreinstellung „Fernseher mit Scart (RGB)“
# Ein guter europäischer Fernseher der 90er am Scart-Eingang mit RGB:
# klares Bild ohne Signalfehler, Schlitzmaske, leicht gewölbtes Glas.
version = 1

[meta]
name = "Fernseher mit Scart (RGB)"
beschreibung = "Europäischer Fernseher der 90er am Scart-Eingang mit RGB: klares Bild, Schlitzmaske, leicht gewölbtes Glas."
lizenz = "gpl"

[signal]
art = "rgb"

[strahl]
form_dunkel = 1.45
form_hell = 0.8
aufblaehen = 0.9
schaerfe = 4.5

[maske]
typ = "schlitzmaske"
staerke = 0.45
staerke_dunkel = 1.1
triaden = 450

[leuchtstoff]
profil = "ebu"
nachgluehen = 0.15

[licht]
glow = 0.06
bloom = 0.1
halation = 0.05

[geometrie]
woelbung_x = 0.02
woelbung_y = 0.025
ecken = 0.03
randweich = 0.15

[helligkeit]
ausgleich_dunkel = 1.8
ausgleich_hell = 1.8
nachher = 1.36
